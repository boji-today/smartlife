name: smartlife

services:
  collect:
    container_name: smartlife
    build: .
    env_file:
      - .env
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
    volumes:
      - ./data:/app/data
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    external: true
    name: bridge
