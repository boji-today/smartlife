name: smartlife

services:
  collect:
    container_name: smartlife
    build: .
    env_file:
      - .env
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - grafana

networks:
  grafana:
    external: true
    name: grafana
